[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coura"
version = "0.1.0"
description = "Local notification courier for AI agent sessions"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "MxBv"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/petronushowcore-mx/notification-courier"
Repository = "https://github.com/petronushowcore-mx/notification-courier"

[project.scripts]
coura = "courier:main"

[tool.setuptools]
py-modules = ["courier", "observer", "coura_mcp", "coura_remote", "coura_pair", "coura_ux"]
