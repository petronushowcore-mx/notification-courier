name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Functional checks and regression mutations
        run: |
          python tests/check_offline.py
          python tests/check_configured.py --mutations
          python tests/check_adopt.py
          python tests/check_observer.py
          python tests/check_observer_lens.py
          python tests/break_observer_lens.py --out "${{ runner.temp }}/coura-observer-lens-mutations"
          python tests/check_v5_regressions.py
          python tests/check_mcp.py
          python tests/check_remote.py
          python tests/check_ux.py
          python tests/check_observer_queue.py
          python tests/break_observer_queue.py --out .queue-mutations
          python tests/check_state_boundaries.py
          python tests/break_state_boundaries.py --out .state-mutations
